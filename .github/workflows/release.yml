name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: typora-pic-cleaner-macos
          - os: windows-latest
            asset: typora-pic-cleaner-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller send2trash
      - name: Run tests before packaging
        run: python -m unittest discover -s tests -t . -q
      - name: Build a single-file binary
        run: >
          pyinstaller --onefile --name ${{ matrix.asset }}
          --collect-submodules tkinter
          run_gui.py
      - name: Smoke-test the binary (macOS)
        if: runner.os == 'macOS'
        run: ./dist/${{ matrix.asset }} --version
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        run: ./dist/${{ matrix.asset }}.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
