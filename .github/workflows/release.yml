name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            arch: arm64
          - os: macos-13            # Intel
            arch: x86_64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller send2trash

      - name: Run tests before packaging
        run: python -m unittest discover -s tests -t . -q

      # Two separate builds on purpose.  A windowed bundle is what Finder and
      # Explorer can launch without spawning a terminal, and a console binary is
      # what actually works when piped or scripted.
      # --windowed alone gives a one-directory build.  On macOS that directory
      # *is* the .app bundle, which is what we want; on Windows it is a plain
      # folder, so the exe has to be requested with --onefile.
      - name: Build the windowed app (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name TyporaPicCleaner
          --osx-bundle-identifier com.muzi-xiaoren.typorapiccleaner
          run_gui.py

      - name: Build the windowed app (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TyporaPicCleaner
          run_gui.py

      - name: Build the console CLI
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name typora-pic-cleaner
          run_cli.py

      # A browser download strips the execute bit from a bare Unix file, so
      # every macOS artifact ships inside an archive that preserves permissions.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/TyporaPicCleaner.app" \
            "TyporaPicCleaner-macos-${{ matrix.arch }}.zip"
          ditto -c -k "dist/typora-pic-cleaner" \
            "typora-pic-cleaner-cli-macos-${{ matrix.arch }}.zip"
          mkdir -p out
          mv ./*.zip out/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/TyporaPicCleaner.exe out/TyporaPicCleaner-windows.exe
          Copy-Item dist/typora-pic-cleaner.exe out/typora-pic-cleaner-cli-windows.exe

      # Prove the packaged binary really works, rather than only that it built:
      # build a miniature vault and check the analysis it reports.
      - name: Smoke-test the packaged CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p fixture/img
          printf '![](img/used.png)\n' > fixture/note.md
          printf 'x' > fixture/img/used.png
          printf 'x' > fixture/img/dead.png
          unzip -q "out/typora-pic-cleaner-cli-macos-${{ matrix.arch }}.zip" -d unpacked
          test -x unpacked/typora-pic-cleaner || { echo "execute bit lost in the archive"; exit 1; }
          ./unpacked/typora-pic-cleaner --version
          ./unpacked/typora-pic-cleaner scan fixture --json > result.json
          python -c "import json;d=json.load(open('result.json'));assert d['unreferenced_count']==1,d;assert d['referenced']==1,d;print('packaged CLI analysis OK')"
          unzip -q "out/TyporaPicCleaner-macos-${{ matrix.arch }}.zip" -d app
          test -x "app/TyporaPicCleaner.app/Contents/MacOS/TyporaPicCleaner" || { echo "app binary not executable"; exit 1; }
          echo "windowed .app packaged OK"

      - name: Smoke-test the packaged CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path fixture/img | Out-Null
          Set-Content -Path fixture/note.md -Value '![](img/used.png)'
          Set-Content -Path fixture/img/used.png -Value 'x'
          Set-Content -Path fixture/img/dead.png -Value 'x'
          ./out/typora-pic-cleaner-cli-windows.exe --version
          ./out/typora-pic-cleaner-cli-windows.exe scan fixture --json > result.json
          python -c "import json;d=json.load(open('result.json'));assert d['unreferenced_count']==1,d;print('packaged CLI analysis OK')"
          # Subsystem 2 == GUI: this is what stops a console window appearing
          # behind the interface, so it is worth asserting rather than assuming.
          python -c "import struct;f=open('out/TyporaPicCleaner-windows.exe','rb');f.seek(60);o=struct.unpack('<I',f.read(4))[0];f.seek(o+24+68);s=struct.unpack('<H',f.read(2))[0];assert s==2,f'subsystem {s}, expected 2 (GUI)';print('windowed exe is a GUI binary OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
